<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top"
     th:fragment="topbar(activeTop)">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Java Academy</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="topnav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTop}=='home' ? ' active'"
             th:href="@{/}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activeTop}=='registrants' ? ' active'"
             th:href="@{/registrants}">Registrants</a>
        </li>
        <!-- ถ้ามีหน้า Register ทีหลัง ค่อยเพิ่มเมนูตรงนี้ -->
      </ul>
    </div>
  </div>
</nav>
</body>
</html>
